<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Земля — CRM для подбора</title>
<style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.4;
  font-synthesis: none;
  color: var(--ink);
  background: var(--canvas);
  --canvas: #17232e;
  --sidebar-fill: #121d28;
  --bar: #1a2835;
  --well: #1b2a38;
  --surface: #233445;
  --raised: #2a3e50;
  --hover: #31495d;
  --edge: #364e62;
  --line: #314558;
  --ink: #e1eaf1;
  --muted: #b3c4d1;
  --faint: #9db0bf;
  --accent: #a1c8e2;
  --accent-button: #426887;
  --accent-button-hover: #537d9b;
  --ring: #91bce0;
  --sidebar: 212px;
}
*, *::before, *::after { box-sizing: border-box; }
body, h1, h2, h3, p { margin: 0; }
button, input, select, textarea { color: inherit; font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .43; cursor: default; }
a { color: var(--accent); }
:where(button, a, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { display: block; width: 18px; height: 18px; flex: none; }
button svg, a svg { pointer-events: none; }
[data-icon] { display: inline-flex; align-items: center; justify-content: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  padding: 24px 13px 15px; border-right: 1px solid #263847; background: var(--sidebar-fill); z-index: 2;
}
.brand { display: flex; align-items: center; gap: 11px; margin: 1px 8px 38px; text-decoration: none; color: var(--ink); font-size: 23px; font-weight: 740; line-height: 1; letter-spacing: -.04em; }
.brand-mark { width: 39px; height: 39px; flex: none; border-radius: 12px; color: #c3e1f3; background: #294457; border: 1px solid #456782; }
.brand-mark svg { width: 24px; height: 24px; }
.brand-sub { display: block; margin-top: 5px; color: var(--faint); font-size: 11px; font-weight: 550; letter-spacing: 0; }
.nav-label { margin: 0 10px 8px; color: var(--faint); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; font-weight: 660; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; margin-bottom: 4px; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; font-size: 13px; font-weight: 620; }
.nav-btn:hover { background: #223547; color: var(--ink); }
.nav-btn.active { background: #294054; border-color: #39566d; color: #cce2f2; }
.nav-count { margin-left: auto; border-radius: 9px; padding: 2px 6px; color: var(--accent); background: #263e51; font-size: 10px; font-variant-numeric: tabular-nums; }
.sidebar-footer { margin-top: auto; }
.profile { display: flex; align-items: center; gap: 9px; margin: 12px 4px 0; padding: 14px 3px 0; border-top: 1px solid var(--line); }
.profile-avatar { width: 33px; height: 33px; flex: none; border-radius: 9px; background: var(--surface); color: var(--accent); }
.profile strong, .profile small { display: block; }
.profile strong { font-size: 11.5px; }
.profile small { margin-top: 1px; color: var(--faint); font-size: 10px; }

main { min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 63px; padding: 0 27px; border-bottom: 1px solid var(--line); background: var(--bar); }
.crumb, .top-actions { display: flex; align-items: center; gap: 9px; }
.crumb { color: var(--muted); white-space: nowrap; font-size: 12px; }
.crumb svg { width: 16px; height: 16px; color: var(--accent); }
.crumb strong { color: var(--ink); font-weight: 640; }
.slash { color: var(--faint); margin: 0 3px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 37px; padding: 7px 12px; text-decoration: none; font-size: 12.5px; font-weight: 650; white-space: nowrap; color: var(--ink); background: var(--surface); border: 1px solid var(--edge); border-radius: 8px; }
.button svg { width: 16px; height: 16px; }
.button:hover { background: var(--hover); border-color: #6486a1; }
.button.primary { background: var(--accent-button); border-color: #6286a4; color: #f1f7fc; }
.button.primary:hover { background: var(--accent-button-hover); border-color: #82a6c1; }
.button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.button.ghost:hover { color: var(--ink); background: var(--surface); border-color: var(--line); }
.icon-button { display: grid; place-items: center; flex: none; width: 31px; height: 31px; border: 1px solid var(--edge); border-radius: 7px; background: var(--surface); color: var(--accent); }
.icon-button:hover { background: var(--hover); }
.icon-button svg { width: 15px; height: 15px; }

.workspace { width: min(100%, 1730px); margin: auto; padding: 24px 27px 34px; }
.page-heading {
  --earth-size: clamp(151px, 15vw, 204px);
  display: grid; grid-template-columns: minmax(0, 1fr) var(--earth-size); align-items: center; gap: 10px;
  position: relative; isolation: isolate; overflow: hidden; margin-bottom: 18px; padding: 8px clamp(18px, 3vw, 35px);
  border: 1px solid #32495b; border-radius: 15px;
  background: linear-gradient(105deg, #223647, #142635 68%, #111d2a);
}
.hero-copy { position: relative; z-index: 1; min-width: 0; padding-block: 13px; }
.hero-labels { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; margin-bottom: 9px; }
.eyebrow { display: flex; align-items: center; gap: 6px; color: #abc8dd; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #8cbadc; }
.demo-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border: 1px solid #486377; border-radius: 6px; color: #c6d9e8; background: #2a4052; white-space: nowrap; font-size: 10px; line-height: 1.15; }
.demo-badge svg { width: 11px; height: 11px; }
h1 { max-width: 100%; font-size: clamp(26px, 3.4vw, 44px); font-weight: 750; line-height: 1.05; letter-spacing: -.042em; overflow-wrap: anywhere; }
.page-heading p { margin-top: 8px; max-width: 48ch; color: #b6cad8; font-size: 13px; }
.earth-illustration { position: relative; align-self: center; aspect-ratio: 1; width: 100%; pointer-events: none; }
.earth-frame {
  position: absolute; inset: 0 0 0 auto; width: 200%;
  -webkit-mask-image: linear-gradient(0deg, transparent 0%, #000 3.5%, #000 96.5%, transparent);
  mask-image: linear-gradient(0deg, transparent 0%, #000 3.5%, #000 96.5%, transparent);
}
.earth-illustration img {
  display: block; width: 100%; height: 100%; object-fit: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 41%, #000 98.8%, transparent);
  mask-image: linear-gradient(90deg, transparent 0%, #000 41%, #000 98.8%, transparent);
}

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; margin-bottom: 19px; }
.stat { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.stat-icon { display: grid; place-items: center; width: 35px; height: 35px; flex: none; border-radius: 9px; color: var(--tone); background: var(--tint); }
.stat strong, .stat small { display: block; }
.stat small { color: var(--muted); font-size: 11px; line-height: 1.2; }
.stat strong { margin-top: 2px; font-size: 23px; font-weight: 720; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sprout, .purple { --tint: #2a465d; --tone: #afd5f0; --dot: #82acca; }
.moss { --tint: #433f3a; --tone: #ddc9ac; --dot: #baaa8d; }
.fern, .blue { --tint: #2d425c; --tone: #b8cfee; --dot: #8cabc9; }
.sage { --tint: #37454f; --tone: #c4d6e2; --dot: #9aaebd; }
.jade { --tint: #294650; --tone: #acd2db; --dot: #82b0b8; }
.mint, .green { --tint: #2e464f; --tone: #bed3df; --dot: #86aab4; }
.canopy { --tint: #30483f; --tone: #b8d8c4; --dot: #87ae98; }
.archive-tone { --tint: #493e43; --tone: #e1bebc; --dot: #ae8991; }

.toolbar, .filters, .advanced-filters, .board-controls { display: flex; align-items: center; }
.toolbar { justify-content: space-between; flex-wrap: wrap; gap: 9px; margin-bottom: 9px; }
.switcher { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--well); border: 1px solid var(--line); }
.switcher button { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 600; white-space: nowrap; }
.switcher button.active, .switcher button:hover { background: var(--raised); color: var(--accent); }
.switcher svg, .filters svg { width: 15px; height: 15px; }
.filters { gap: 7px; min-width: 0; max-width: 100%; }
.search, .vacancy-filter { display: flex; align-items: center; gap: 7px; padding: 0 9px; min-width: 0; height: 34px; border: 1px solid var(--edge); border-radius: 7px; background: var(--well); color: var(--accent); }
.filters :is(input, select) { min-width: 0; min-height: 29px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
.filters label:focus-within { outline: 2px solid var(--ring); outline-offset: 1px; }
.search input { width: min(40vw, 154px); }
::placeholder { color: var(--faint); opacity: 1; }
.vacancy-filter select { appearance: none; max-width: 156px; padding-right: 15px; margin-right: -17px; }
.vacancy-filter [data-icon="chevron"] { pointer-events: none; }
.advanced-filters { flex-wrap: wrap; gap: 7px 9px; margin-bottom: 10px; }
.advanced-filters label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.advanced-filters :is(input[type="date"], select), .due-toggle { min-height: 31px; min-width: 0; max-width: 142px; padding: 3px 6px; border: 1px solid var(--edge); border-radius: 6px; color: var(--ink); background: var(--well); font-size: 11px; }
.due-toggle input { margin: 0; accent-color: #80a9c7; }
.advanced-filters .ghost { min-height: 31px; padding-block: 3px; font-size: 11px; }
option { color: var(--ink); background: var(--surface); }
.board-controls { justify-content: space-between; gap: 8px; padding: 1px 0 7px; color: var(--muted); font-size: 12px; }
.board-controls > div { display: flex; gap: 6px; }
.board-controls .icon-button { height: 28px; }

.board { display: grid; grid-template-columns: repeat(11, minmax(178px, 1fr)); align-items: start; gap: 10px; padding-bottom: 13px; overflow: auto; scrollbar-width: thin; scrollbar-color: #59778f #202e3c; scroll-snap-type: x proximity; }
.column { min-height: 350px; padding: 0 7px 9px; border: 1px solid var(--line); border-top: 2px solid var(--dot); border-radius: 10px; background: var(--well); scroll-snap-align: start; }
.column.drop-target { background: var(--tint); outline: 2px dashed var(--dot); outline-offset: -4px; }
.column-heading { display: flex; align-items: center; gap: 6px; min-height: 45px; padding: 7px 2px; }
.column-heading h2 { flex: 1; font-size: 12px; line-height: 1.2; font-weight: 680; }
.column-dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--dot); }
.count { min-width: 19px; padding: 2px 4px; text-align: center; border-radius: 5px; background: var(--tint); color: var(--tone); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cards { display: grid; gap: 7px; }
.cards > .button { min-height: 32px; }
.column-empty { padding: 15px 3px; border: 1px dashed var(--edge); border-radius: 6px; color: var(--faint); text-align: center; font-size: 11px; }
.candidate { min-width: 0; padding: 8px; border: 1px solid var(--edge); border-radius: 8px; background: var(--surface); cursor: pointer; }
.candidate:hover { border-color: #6a8da8; background: #293e50; }
.candidate:active { cursor: grabbing; }
.candidate.dragging { opacity: .44; }
.card-top { min-width: 0; display: flex; align-items: center; gap: 6px; }
.avatar { display: grid; place-items: center; width: 27px; height: 27px; flex: none; border-radius: 7px; background: var(--tint); color: var(--tone); font-size: 10px; font-weight: 720; }
.candidate-name { min-width: 0; padding: 0; margin: 0; border: 0; background: transparent; color: var(--ink); text-align: left; font-size: 12px; line-height: 1.14; font-weight: 720; overflow-wrap: anywhere; }
.candidate-name:hover { color: var(--accent); }
.card-top .candidate-name { display: flex; align-items: baseline; gap: 4px; flex: 1 1 0; }
.candidate-name-primary { min-width: 0; }
.candidate-name-surname { color: var(--muted); font-weight: 540; }
.card-top .candidate-name-surname { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-note-trigger { display: grid; place-items: center; flex: none; padding: 3px; border: 0; border-radius: 4px; background: transparent; color: var(--accent); }
.card-note-trigger:hover { background: var(--hover); }
.card-note-trigger svg { width: 14px; height: 14px; }
.card-job, .card-note { margin-top: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-note { padding: 4px 5px; background: var(--well); border-radius: 4px; font-size: 10px; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 3px; min-height: 25px; padding-top: 6px; margin-top: 7px; border-top: 1px solid var(--edge); }
.phone, .subtle { color: var(--faint); font-size: 10.5px; }
.phone { display: inline-flex; gap: 4px; align-items: center; color: var(--accent); text-decoration: none; white-space: nowrap; }
.phone svg { width: 12px; height: 12px; }
a.phone:hover { text-decoration: underline; }
.lead-age, .repeat-badge, .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 5px; border-radius: 5px; font-size: 10px; font-weight: 650; }
.lead-age { font-variant-numeric: tabular-nums; background: #314759; color: #c6d6e2; white-space: nowrap; }
.repeat-badge { max-width: 100%; color: #bed8ee; background: #2e4860; white-space: normal; }
.repeat-badge svg { width: 12px; height: 12px; }
.card-job + .repeat-badge { margin-top: 5px; }
.candidate-years { display: inline-block; margin-top: 5px; font-size: 10px; color: var(--muted); }
.repeat-badge + .candidate-years { margin-left: 5px; }
.callback { display: flex; align-items: flex-start; gap: 4px; margin-top: 6px; color: #b8d1e8; font-size: 10px; line-height: 1.2; }
.callback svg { width: 12px; height: 12px; }
.attempts { margin-top: 5px; color: #ddc6a8; font-size: 10px; }
.candidate.overdue, .table tr.overdue { background: #3a2c39; }
.candidate.overdue { border-color: #966b7c; }
.overdue .callback { color: #f2b9c4; }
.quick-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.quick { min-height: 23px; padding: 3px 5px; border: 1px solid transparent; border-radius: 5px; color: var(--tone); background: var(--tint); font-size: 10px; font-weight: 660; white-space: nowrap; }
.quick:hover { border-color: var(--dot); }
.quick-archive { border-color: #695660; color: #e0bdc5; background: #3d333d; }
.quick-archive:hover { border-color: #ad7d8c; background: #523948; }

.panel { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel + .button { margin-top: 7px; }
.table { width: 100%; min-width: 640px; border-collapse: collapse; text-align: left; font-size: 12px; }
.table :is(th, td) { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.table th { color: var(--muted); background: var(--well); font-size: 11px; font-weight: 650; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover { background: var(--raised); }
.table th:last-child, .table td:last-child { white-space: nowrap; }
.table td .repeat-badge { margin-left: 6px; }
.tag { background: var(--tint); color: var(--tone); white-space: nowrap; }
.tag::before { content: ""; width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--dot); }
.empty-panel { padding: 30px 12px; color: var(--muted); text-align: center; font-size: 13px; }
.onboarding { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px; margin-bottom: 10px; padding: 10px 13px; border: 1px solid var(--edge); border-radius: 8px; background: var(--raised); }
.onboarding strong { font-size: 13px; }
.onboarding p { color: var(--muted); font-size: 12px; }

dialog { width: min(590px, 100% - 22px); max-height: calc(100% - 22px); padding: 0; border: 1px solid var(--edge); border-radius: 13px; background: var(--surface); color: var(--ink); box-shadow: 0 23px 70px #070f18a0; }
dialog::backdrop { background: #0a141dc9; }
.dialog-header, .dialog-footer { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 18px 12px; }
.dialog-header { border-bottom: 1px solid var(--line); }
.dialog-header h2 { font-size: 20px; font-weight: 730; line-height: 1.15; overflow-wrap: anywhere; }
.dialog-header p { margin-top: 4px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.dialog-footer { justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
.dialog-body { padding: 13px 18px; overflow-wrap: anywhere; }
.dialog-copy { margin-bottom: 9px; color: var(--muted); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 590; }
.field :is(input, select, textarea) { min-width: 0; width: 100%; padding: 7px 8px; border: 1px solid var(--edge); border-radius: 6px; background: var(--well); color: var(--ink); font-size: 13px; }
.field textarea { min-height: 70px; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px; }
.fields .full { grid-column: 1 / -1; }
.import-drop { display: grid; justify-items: center; gap: 6px; padding: 16px 10px; border: 1px dashed #6b8ca5; border-radius: 8px; color: var(--accent); background: var(--well); text-align: center; font-size: 13px; }
.import-drop.drop-target { background: var(--hover); }
.import-drop > span svg { width: 22px; height: 22px; }
.import-drop p { color: var(--muted); font-size: 11px; }
.notice { padding: 7px 9px; margin: 6px 0; border-radius: 6px; background: #284359; color: #d0e2f0; font-size: 12px; }
.notice.error { color: #efc5cd; background: #503742; }
.sample { max-height: 125px; overflow: auto; margin: 7px 0; border: 1px solid var(--line); border-radius: 6px; font-size: 11px; }
.sample table { border-collapse: collapse; width: 100%; text-align: left; }
.sample :is(th, td) { padding: 5px 7px; border-bottom: 1px solid var(--line); max-width: 240px; overflow-wrap: anywhere; vertical-align: top; }
.sample th { position: sticky; top: 0; background: var(--well); }
.loading { color: var(--muted); font-size: 13px; }
.toast { position: fixed; z-index: 30; bottom: 16px; right: 17px; max-width: calc(100% - 27px); padding: 9px 13px; border: 1px solid #57758b; border-radius: 9px; background: #2b475e; color: var(--ink); box-shadow: 0 5px 18px #090f15a0; font-size: 12px; }

.contact-screen { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; max-width: none; max-height: none; padding: 0; margin: 0; border: 0; border-radius: 0; box-shadow: none; background: var(--canvas); overflow: auto; overscroll-behavior: contain; }
.contact-top { position: sticky; z-index: 2; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: center; min-height: 56px; padding: 7px max(12px, calc((100% - 1200px)/2)); background: var(--bar); border-bottom: 1px solid var(--line); }
.contact-top .contact-back { justify-self: start; }
.contact-top .icon-button { justify-self: end; }
.contact-top > span { text-align: center; font-size: 13px; font-weight: 620; }
.contact-wrap { width: min(1200px, 100% - 30px); margin: auto; padding: 21px 0 30px; }
.contact-hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 0 17px; }
.contact-identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
.contact-identity h2 { font-size: clamp(24px, 4.3vw, 38px); line-height: 1.08; letter-spacing: -.035em; overflow-wrap: anywhere; }
.contact-identity p { margin-top: 5px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.contact-avatar { width: 48px; height: 48px; font-size: 17px; border-radius: 12px; }
.contact-badges { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.contact-badges :is(.repeat-badge, .tag) { padding: 5px 7px; font-size: 11px; }
.contact-grid { display: grid; grid-template-columns: minmax(245px, .86fr) minmax(315px, 1.5fr); gap: 12px; align-items: start; }
.contact-profile { display: grid; gap: 10px; min-width: 0; }
.contact-panel { min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
.contact-panel h3 { margin: 0 0 10px; font-size: 15px; }
.contact-phone { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.contact-phone .phone { font-size: 14px; font-weight: 660; }
.contact-phone .icon-button { width: 26px; height: 26px; }
.contact-facts { display: grid; gap: 0; margin: 0; }
.contact-facts > div { display: grid; gap: 2px; padding: 7px 0; border-top: 1px solid var(--line); }
.contact-facts dt { color: var(--muted); font-size: 11px; font-weight: 630; }
.contact-facts dd { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.contact-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.contact-actions .quick-archive { padding-inline: 8px; min-height: 35px; font-size: 11px; }
.note-composer { padding: 8px; margin-bottom: 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--well); }
.note-composer .field { margin-bottom: 6px; }
.note-composer textarea { min-height: 80px; background: var(--bar); }
.note-actions { display: flex; justify-content: flex-end; }
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline-item { display: grid; grid-template-columns: 27px minmax(0, 1fr); gap: 8px; position: relative; min-height: 40px; }
.timeline-item:not(:last-child)::before { content: ""; position: absolute; inset: 25px auto 0 12px; width: 1px; background: var(--edge); }
.timeline-icon { display: grid; place-items: center; position: relative; width: 24px; height: 24px; border-radius: 50%; background: var(--raised); color: var(--accent); }
.timeline-icon svg { width: 13px; height: 13px; }
.timeline-entry { min-width: 0; padding: 4px 0 10px; }
.timeline-meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 3px 10px; font-size: 12px; }
.timeline-meta time { color: var(--faint); font-size: 10.5px; }
.timeline-entry p { margin-top: 3px; color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.feed-empty { padding: 8px 0; color: var(--muted); font-size: 13px; }

@media (max-width: 1180px) {
  :root { --sidebar: 183px; }
  .workspace, .topbar { padding-inline: 18px; }
}
@media (max-width: 840px) {
  :root { --sidebar: 59px; }
  .sidebar { padding: 15px 6px 11px; }
  .brand { margin: 0 auto 20px; justify-content: center; }
  .brand > span:last-child, .nav-label, .nav-count, .profile > div:last-child { display: none; }
  .nav-btn { justify-content: center; gap: 0; padding: 7px; font-size: 0; }
  .profile { justify-content: center; margin-inline: 0; }
  .workspace, .topbar { padding-inline: 12px; }
  .stat { padding: 8px; gap: 6px; }
  .stat-icon { width: 28px; height: 28px; }
  .stat-icon svg { width: 15px; height: 15px; }
}
@media (max-width: 650px) {
  .contact-grid { grid-template-columns: 1fr; }
  .contact-wrap { width: calc(100% - 18px); padding-top: 11px; }
  .contact-activity { grid-row: 1; }
  .contact-top { min-height: 48px; padding: 4px 8px; }
  .contact-panel { padding: 10px; }
  .contact-avatar { width: 39px; height: 39px; }
  .page-heading { --earth-size: clamp(100px, 25vw, 151px); gap: 5px; padding: 5px 10px; }
  .hero-copy { padding-block: 9px; }
  .hero-labels { margin-bottom: 6px; }
  .page-heading p { margin-top: 6px; font-size: 11px; }
}
@media (max-width: 560px) {
  .layout { display: block; }
  .sidebar { position: relative; flex-direction: row; align-items: center; gap: 4px; height: auto; padding: 6px 7px; border: 0; border-bottom: 1px solid var(--line); }
  .brand { margin: 0 2px 0 0; }
  .brand-mark { width: 30px; height: 30px; border-radius: 7px; }
  .brand-mark svg { width: 20px; height: 20px; }
  .sidebar nav, .sidebar-footer { display: flex; align-items: center; gap: 1px; }
  .sidebar-footer { margin: 0 0 0 auto; }
  .nav-btn { width: 32px; min-height: 31px; margin: 0; }
  .profile, .crumb > span:nth-child(2), .crumb .slash { display: none; }
  .topbar { height: 47px; padding-inline: 7px; }
  .top-actions, .crumb { gap: 3px; }
  .top-actions .button { min-height: 30px; padding: 4px 6px; font-size: 11px; }
  .workspace { padding: 11px 7px 25px; }
  .page-heading, .stats { margin-bottom: 11px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .stat strong { font-size: 20px; }
  .stats, .toolbar, .advanced-filters { row-gap: 6px; }
  .vacancy-filter select { max-width: min(35vw, 138px); }
  .board { grid-template-columns: repeat(11, minmax(179px, 1fr)); }
  .card-note-trigger { padding: 5px; }
  .quick { min-height: 28px; }
  .dialog-header, .dialog-body, .dialog-footer { padding-inline: 11px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }

.team-auth { min-height:100vh; display:grid;place-items:center;padding:18px; }
.team-auth-panel {width:min(100%,420px);background:var(--surface);border:1px solid var(--edge);border-radius:15px;padding:27px;}
.team-auth-brand {color:var(--accent);font-weight:700;margin-bottom:8px;}
.team-auth h1 {font-size:29px;margin-bottom:20px;}
.team-tools {display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;}
.team-pick {font-size:11px;margin-top:6px;color:var(--muted);}
.team-pick label {display:flex;align-items:center;gap:4px;cursor:pointer;}
.team-pick input {margin:0;accent-color:var(--accent);}
.team-pick span {overflow-wrap:anywhere;}
.team-members {padding:0;margin:0 0 14px;list-style:none;}
.team-members li {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);}
.team-members :is(small,strong) {display:block;overflow-wrap:anywhere;}
.team-members small {color:var(--muted);}
</style>

const fields = [
  {id:'name', label:'ФИО / имя', aliases:['фио','ф и о','фамилия имя отчество','фио кандидата','фио соискателя','имя','имя кандидата','имя соискателя','имя откликнувшегося','кандидат','соискатель','applicant','candidate','name','full name','full_name']},

  const result = {added:0,duplicates:0,updated:0,skipped};
  const writes = [];
  const existing = new Map(records.map(contact => [contact.id,hydrateContact(contact)]));
  const identities = candidateIndex(existing.values());
  const now = Date.now();
  const occurrences = new Map();
  for(const [position,incoming] of contacts.entries()) {
    const current = (restore && existing.get(incoming.id)) || identities.find(incoming,existing);
    const signature = responseSignature(incoming);
    const occurrenceKey = JSON.stringify([identityKeys(incoming).values().next().value,signature]);
    const occurrence = (occurrences.get(occurrenceKey) ?? 0) + 1;
    occurrences.set(occurrenceKey,occurrence);
    const responseKey = occurrence > 1 && !incoming.sourceId ? signature + '#' + occurrence : signature;
    let contact;
    if(current) {
      if(restore) {
        if(incoming.updatedAt <= current.updatedAt) { result.duplicates++; continue; }
        contact = {...incoming,id:current.id};
        result.updated++;
      } else {
        result.duplicates++;
        const merged = mergeResponse(current,incoming);
        const fieldsChanged = ['name','phone','job','date','firstResponseDate','sourceId','adId','extra'].some(field =>
          JSON.stringify(current[field]) !== JSON.stringify(merged[field]));
        const repeatedResponse = !current.responseKeys.includes(responseKey);
        if(!fieldsChanged && !repeatedResponse) continue;
        if(repeatedResponse) {
          merged.responseKeys = [...current.responseKeys,responseKey];
          contact = addEvent(merged,{kind:'repeat',at:now,job:incoming.job,date:incoming.date});
        } else {
          contact = addEvent(merged,{kind:'refresh',at:now,job:incoming.job});
        }
        result.updated++;
      }
    } else {
      contact = restore ? incoming : {
        ...incoming,id:uid(),status:'new',note:'',attempts:0,reminder:null,source,firstResponseDate:incoming.date,
        updatedAt:now - position,responseKeys:[responseKey],events:[{kind:'import',at:now,job:incoming.job}]

function candidateNameParts(contact) {

  const patronymic = nameField(['отчество','отчество кандидата','отчество соискателя','patronymic','middle name']);
  const surname = nameField(['фамилия','фамилия кандидата','фамилия соискателя','фамилия откликнувшегося','last name','surname']);
  const explicitPrimary = [first || (words.length === 1 ? source : ''),patronymic].filter(Boolean).join(' ');
  if(explicitPrimary && (first || patronymic || surname) && words.length <= 1) {
    return {primary:explicitPrimary,surname:asText(surname)};
  }
  if(first && patronymic && surname) return {primary:explicitPrimary,surname:asText(surname)};
  const nativeName = /^[\p{Script=Cyrillic}\p{M}.'’\-]+$/u;
  if(words.length < 2 || !words.every(word => nativeName.test(word))) {
    return {primary:source || 'Без имени',surname:''};

  const patronymicEnding = /(?:ович|евич|ёвич|овна|евна|ёвна|ична|инична|ич)$/iu;

    Number(/(?:ина?|ына?|ко|ой)$/iu.test(word));

  if(words.length >= 3 && (patronymicEnding.test(words[1]) || particle.test(words[2])) &&

function timelineItems(contact) {

async function loadImport(file) {
  const token = ++state.importJob;
  showDialog('Загрузить отклики',file.name,'<p class="loading">Читаем файл…</p>');
  try {
    if(file.size > 20 * 1024 * 1024) throw new Error('Файл больше 20 МБ. Разделите выгрузку на несколько файлов.');
    const ext = file.name.split('.').pop().toLowerCase();
    if(!['xlsx','csv','tsv'].includes(ext)) throw new Error('Поддерживаются XLSX, CSV и TSV. Для файла XLS сохраните копию в XLSX.');
    const bytes = await file.arrayBuffer();
    const csv = ext === 'xlsx' ? null : parseCSV(new Uint8Array(bytes));
    const source = csv ? {sheets:['Таблица'],date1904:false,rowsAt:async () => csv} : await openXlsx(bytes);
    if(token !== state.importJob || !dialog.open) return;
    state.importSource = {...source, name:file.name, sheet:0, header:0};
    await selectSheet(0);
  } catch(error) {
    if(token === state.importJob && dialog.open) importDialog(error.message || 'Не удалось прочитать файл.');
  }
}

  }
}

    if(new Set(selectedColumns).size !== selectedColumns.length) return {error:'Выберите отдельный столбец для каждого поля.'};
    if(!isOwner()) return {error:'Импорт доступен администратору.'};

    } catch(error) {

       typeof contact.status !== 'string' || (!Object.hasOwn(stageById,contact.status) && contact.status !== 'working') || !validTime(contact.updatedAt) ||
       !Array.isArray(contact.extra) || !contact.extra.every(item => Array.isArray(item) && item.length === 2 && item.every(value => typeof value === 'string'))) {
      throw new Error('В копии есть повреждённая карточка.');
    }
    const events = (contact.events ?? []);
    if(!Array.isArray(events) || !events.every(event => event && typeof event.kind === 'string' && validTime(event.at) &&
      (event.reminder == null || validTime(event.reminder)))) throw new Error('В копии повреждена история действий.');
    const attempts = contact.attempts ?? 0;
    const reminder = contact.reminder ?? null;
    if(!Number.isSafeInteger(attempts) || attempts < 0 || (reminder !== null && !validTime(reminder))) {
      throw new Error('В копии повреждены данные перезвона.');
    }
    const responseKeys = (contact.responseKeys ?? [responseSignature(contact)]);
    if(!Array.isArray(responseKeys) || !responseKeys.length || !responseKeys.every(value => typeof value === 'string')) {
      throw new Error('В копии повреждены данные об откликах.');
    }
    const {id,name,phone,status,updatedAt,extra} = contact;
    return {id,name,phone,status:status === 'working' ? 'talking' : status,updatedAt,extra,attempts,reminder,events,responseKeys:[...new Set(responseKeys)],source:asText(contact.source),job:asText(contact.job),date:asText(contact.date),firstResponseDate:asText(contact.firstResponseDate) || previousResponseDate(contact),
      sourceId:asText(contact.sourceId),adId:asText(contact.adId),note:asText(contact.note)};
  });
  const logs = data.imports.map(log => {
    if(!log || typeof log.id !== 'string' || !validTime(log.at) ||
       ![log.added,log.duplicates,log.skipped,log.updated].every(value => Number.isSafeInteger(value) && value >= 0)) {
      throw new Error('В копии повреждена история импорта.');
    }
    const {id,at,added,duplicates,skipped,updated} = log;
    return {id,at,added,duplicates,skipped,updated,file:asText(log.file),sheet:asText(log.sheet),restore:Boolean(log.restore)};
  });
  return {contacts,logs};
}
async function restoreBackup(file) {
  try {
    const backup = readBackup(JSON.parse(await file.text()));
    showDialog('Восстановить данные?',file.name,
      '<p class="dialog-copy">В копии ' + formatCount(backup.contacts.length) + ' откликов. Записи объединятся с текущей базой. Для совпадающих карточек сохранятся более свежие изменения.</p>',
      '<button class="button" data-close>Отмена</button><button class="button primary" id="confirm-restore">Восстановить</button>');
    $('#confirm-restore').onclick = async event => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const result = await persistCandidates({...backup,file:file.name,restore:true});
          state.view = 'board';
        await committed();
        dialog.close();
        toast('Добавлено ' + result.added + ' · обновлено ' + result.updated + ' · повторы ' + result.duplicates);
      } catch(error) { button.disabled = false; report(error); }
    };
  } catch(error) { toast(error instanceof SyntaxError ? 'Файл не содержит корректную JSON-копию.' : error.message); }
}

function resetFilters() {
  Object.assign(state,{query:'',vacancy:'',from:'',to:'',status:'',onlyDue:false,limits:{}});
  for(const id of ['search','vacancies','date-from','date-to','status-filter']) $('#' + id).value = '';
  $('#only-due').checked = false;
}
function syncBoardControls() {
  const board = $('.board');
  if(!board) return;
  $('#scroll-left').disabled = board.scrollLeft < 2;
  $('#scroll-right').disabled = board.scrollLeft + board.clientWidth + 2 >= board.scrollWidth;
}
function bindDrag() {
  const results = $('#results');
  results.addEventListener('dragstart',event => {
    const item = event.target.closest('[data-card]');
    if(!item) return;
    if(event.target.closest('a,button')) { event.preventDefault(); return; }
    state.drag = item.dataset.card;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain',state.drag);
    item.classList.add('dragging');
  });
  results.addEventListener('dragover',event => {
    const column = event.target.closest('[data-stage]');
    if(!column || !state.drag) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    column.classList.add('drop-target');
    const board = column.closest('.board');
    const bounds = board.getBoundingClientRect();
    if(event.clientX > bounds.right-58) board.scrollLeft += 24;
    else if(event.clientX < bounds.left+58) board.scrollLeft -= 24;
  });
  results.addEventListener('dragleave',event => {
    const column = event.target.closest('[data-stage]');
    if(column && (!(event.relatedTarget instanceof Node) || !column.contains(event.relatedTarget))) column.classList.remove('drop-target');
  });
  function clearDrag() {
    state.drag = null;
    for(const item of all('.dragging,.column.drop-target')) item.classList.remove('dragging','drop-target');
  }
  results.addEventListener('dragend',clearDrag);
  results.addEventListener('drop',async event => {
    const column = event.target.closest('[data-stage]');
    if(!column || !state.drag) return;
    event.preventDefault();
    const id = state.drag;
    const status = column.dataset.stage;
    clearDrag();
    const contact = (state.demo ? demoContacts : state.contacts).find(item => item.id === id);
    if(!contact || contact.status === status) return;
    try { await updateRecord(id,{status}); toast('Перенесено · ' + stageById[status].name); }
    catch(error) { report(error); }
  });
}
function bindEvents() {
  for(const item of all('[data-icon]')) item.innerHTML = icon(item.dataset.icon);
  for(const item of all('.sidebar button,.brand')) {
    item.title = item.textContent.trim();
    item.setAttribute('aria-label',item.textContent.trim());
  }
  document.addEventListener('click',event => {
    if(event.target.closest('.team-pick')) return;
    const target = event.target.closest('[data-view],[data-import],[data-contact],[data-close],[data-more],[data-quick],[data-archive],[data-note],[data-phone],[data-card]');
    if(!target) return;
    if(target.hasAttribute('data-view')) {
      event.preventDefault();
      if((state.view === 'archive') !== (target.dataset.view === 'archive')) resetFilters();
      state.view = target.dataset.view;
      render();
    } else if(target.hasAttribute('data-import')) importDialog();
    else if(target.hasAttribute('data-close')) { if(!state.committing) dialog.close(); }
    else if(target.hasAttribute('data-more')) {
      const id = target.dataset.more;
      state.limits[id] = (state.limits[id] ?? (id === 'list' ? 50 : 35)) + 50;
      renderResults();
      $('[data-more="' + id + '"]')?.focus();
    } else if(target.hasAttribute('data-quick')) {
      const status = target.dataset.quick;
      target.disabled = true;
      updateRecord(target.dataset.for,{kind:'call',status}).then(() => {
        toast('Звонок записан · ' + stageById[status].name);
      },error => { target.disabled = false; report(error); });
    } else if(target.hasAttribute('data-archive')) {
      const id = target.dataset.for;
      const restore = target.dataset.archive === 'restore';
      target.disabled = true;
      updateRecord(id,{kind:'edit',status:restore ? 'new' : archivedStage.id}).then(() => {
        if(dialog.dataset.contactId === id) dialog.close();
        toast(restore ? 'Кандидат возвращён в «Лид».' : 'Кандидат перенесён во вкладку «Отказ».');
      },error => { target.disabled = false; report(error); });
    } else if(target.hasAttribute('data-note')) {
      detailDialog(target.dataset.note);
      $('#contact-note')?.focus();
    } else if(target.hasAttribute('data-phone')) {
      const id = target.dataset.phone;
      updateRecord(id,{kind:'dial'}).then(() => syncContactFeed(id),report);
    } else if(target.hasAttribute('data-contact')) detailDialog(target.dataset.contact);
    else if(!event.target.closest('a')) detailDialog(target.dataset.card);
  });
  dialog.addEventListener('cancel',event => { if(state.committing) event.preventDefault(); });
  dialog.addEventListener('close',() => {
    if(dialog.open) return;
    state.importJob++;
    delete dialog.dataset.contactId;
  });
  $('#search').addEventListener('input',event => { state.query = event.target.value; state.limits = {}; renderResults(); });
  $('#vacancies').addEventListener('change',event => { state.vacancy = event.target.value; state.limits = {}; renderResults(); });
  $('#backup').onclick = backupDialog;
  $('#export').onclick = exportDialog;
  $('#status-filter').innerHTML += stages.map(stage => '<option value="' + stage.id + '">' + stage.name + '</option>').join('');
  for(const [id,key] of [['date-from','from'],['date-to','to'],['status-filter','status'],['only-due','onlyDue']]) {
    $('#' + id).addEventListener('change',event => {
      state[key] = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
      state.limits = {};
      renderResults();
      if(key === 'status' && state.status) {
        const board = $('.board');
        const column = board?.querySelector('[data-stage="' + state.status + '"]');
        if(column) board.scrollLeft += column.getBoundingClientRect().left - board.getBoundingClientRect().left;
      }
    });
  }
  $('#clear-filters').onclick = () => { resetFilters(); renderResults(); };
  let today = localDay();
  setInterval(() => {
    const now = Date.now();
    const todayNow = localDay();
    const dayChanged = todayNow !== today;
    today = todayNow;
    if(state.view === 'history' || state.drag) return;
    if(dayChanged) {
      renderStats(state.demo ? demoContacts : state.contacts);
      renderResults();
      return;
    }
    if(state.onlyDue && !dialog.open && !$('#results').contains(document.activeElement)) {
      renderResults();
      return;
    }
    for(const label of all('#results .callback')) {
      if(Number(label.dataset.time) > now) continue;
      label.closest('.candidate,tr')?.classList.add('overdue');
      label.lastElementChild.textContent = 'Просрочено · ' + exactDate.format(Number(label.dataset.time));
    }
  },20000);
  $('#import-file').onchange = event => {
    const file = event.target.files[0];
    event.target.value = '';
    if(file) loadImport(file);
  };
  $('#backup-file').onchange = event => {
    const file = event.target.files[0];
    event.target.value = '';
    if(file) restoreBackup(file);
  };
  for(const [id,direction] of [['scroll-left',-1],['scroll-right',1]]) {
    $('#' + id).onclick = () => {
      const board = $('.board');
      if(board) board.scrollBy({left:direction * Math.max(220,board.clientWidth*.68),behavior:'smooth'});
    };
  }
  window.addEventListener('resize',syncBoardControls);
  bindDrag();
}
function isOwner() { return state.account?.role === 'owner'; }
function assigneeName(contact) {
  return state.members.find(member => member.id === contact.assignee)?.name || 'Без ответственного';
}
function pickLead(contact) {
  return isOwner() ? '<div class="team-pick"><label><input type="checkbox" data-select-lead value="' +
    safe(contact.id) + '" aria-label="Выбрать: ' + safe(labelOf(contact)) + '"' +
    (state.selected.has(contact.id) ? ' checked' : '') + '> <span>' + safe(assigneeName(contact)) + '</span></label></div>' : '';
}
async function teamRequest(path,{method='GET',body}={}) {
  const response = await fetch(path,{method,credentials:'same-origin',...(body===undefined ? {} :
    {headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});
  const data = await response.json();
  if(!response.ok) {
    if(response.status===401 && !['/api/login','/api/session'].includes(path)) {
      state.account = null;
      state.contacts = [];
      state.members = [];
      state.imports = [];
      state.selected.clear();
      if(dialog.open) dialog.close();
      showAccount({account:null,setup:false});
    }
    throw new Error(data.error || 'Запрос к CRM не выполнен.');
  }
  return data;
}
function renderSelection() {
  $('#team-assign').disabled = !isOwner() || !state.selected.size;
  $('#team-assign').textContent = 'Назначить сотрудника' + (state.selected.size ? ' · '+state.selected.size : '');
  $('#team-clear').hidden = !state.selected.size;
}
function managePeople() {
  if(!isOwner()) return;
  const members = state.members.map(member => '<li><div><strong>'+safe(member.name)+'</strong><small>'+
    safe(member.email)+'</small></div><button class="button" data-member-toggle="'+safe(member.id)+'" data-active="'+
    (member.active ? '0' : '1')+'">'+(member.active ? 'Отключить вход' : 'Включить вход')+'</button></li>').join('');
  showDialog('Сотрудники','Добавляй аккаунты и управляй доступом.',
    (members ? '<ul class="team-members">'+members+'</ul>' : '<p class="dialog-copy">Сотрудников пока нет.</p>') +
    '<form id="team-new-member"><label class="field">Имя<input name="name" maxlength="120" required></label>'+
    '<label class="field">Логин — рабочая почта<input name="email" type="email" required maxlength="254"></label>'+
    '<button class="button primary" type="submit">Создать аккаунт</button></form>');
  for(const button of all('[data-member-toggle]')) button.onclick = async () => {
    button.disabled = true;
    try {
      await teamRequest('/api/members/'+encodeURIComponent(button.dataset.memberToggle),
        {method:'PATCH',body:{active:button.dataset.active==='1'}});
      await committed();
      managePeople();
    } catch(cause) { button.disabled=false; report(cause); }
  };
  $('#team-new-member').onsubmit = async event => {
    event.preventDefault();
    const submit = event.submitter;
    if(submit) submit.disabled = true;
    try {
      const {member,temporaryPassword} = await teamRequest('/api/members',{method:'POST',body:Object.fromEntries(new FormData(event.target))});
      await committed();
      showDialog('Аккаунт создан',member.name,
        '<p class="dialog-copy">Передай сотруднику логин и временный пароль. При первом входе он задаст свой пароль.</p>'+
        '<dl class="contact-facts"><div><dt>Логин</dt><dd>'+safe(member.email)+'</dd></div>'+
        '<div><dt>Временный пароль</dt><dd><code>'+safe(temporaryPassword)+'</code></dd></div></dl>',
        '<button class="button" id="team-people-back">К сотрудникам</button>');
      $('#team-people-back').onclick = managePeople;
    } catch(cause) { if(submit) submit.disabled=false; report(cause); }
  };
}
function assignLeads(ids) {
  if(!isOwner() || !ids.length) return;
  const assignable = state.members.filter(member=>member.active);
  if(!assignable.length) { managePeople(); return; }
  const selected = ids.length===1 ? currentContact(ids[0])?.assignee : null;
  const options = '<option value="">Без ответственного</option>'+assignable.map(member=>'<option value="'+
    safe(member.id)+'"'+(member.id===selected ? ' selected' : '')+'>'+safe(member.name)+'</option>').join('');
  showDialog('Назначить сотрудника','Выбрано: '+formatCount(ids.length),
    '<label class="field">Ответственный<select id="team-assignee">'+options+'</select></label>',
    '<button class="button" data-close>Отмена</button><button class="button primary" id="team-assign-submit">Сохранить</button>');
  $('#team-assign-submit').onclick = async event => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      const {changed} = await teamRequest('/api/assign',{method:'POST',body:{ids,assignee:$('#team-assignee').value || null}});
      for(const id of ids) state.selected.delete(id);
      await committed();
      if(dialog.open) dialog.close();
      toast('Обновлено карточек: '+formatCount(changed));
    } catch(cause) { button.disabled=false; report(cause); }
  };
}
function showAccount({account,setup}) {
  state.account = account;
  const ready = Boolean(account && !account.temporary);
  $('.layout').hidden = !ready;
  $('#team-account').hidden = ready;
  if(ready) {
    all('[data-owner]').forEach(node=>{ node.hidden = !isOwner(); });
    titles.list = isOwner() ? 'Все отклики' : 'Мои лиды';
    $('#team-list-label').textContent = titles.list;
    $('#team-who').textContent = account.name;
    $('#team-role').textContent = isOwner() ? 'Администратор' : 'Сотрудник';
    return;
  }
  const title = account?.temporary ? 'Задай свой пароль' : setup ? 'Настройка администратора' : 'Вход в «Землю»';
  const fields = account?.temporary ? '<label class="field">Временный пароль<input name="current" type="password" autocomplete="current-password" required></label>' :
    (setup ? '<label class="field">Код настройки из окна сервера<input name="code" required></label><label class="field">Твоё имя<input name="name" required maxlength="120"></label>' : '')+
    '<label class="field">Рабочая почта<input name="email" type="email" autocomplete="username" required></label>';
  const newPassword = setup || account?.temporary;
  $('#team-account').innerHTML = '<section class="team-auth-panel"><p class="team-auth-brand">Земля · CRM</p><h1>'+title+'</h1>'+
    '<form id="team-account-form">'+fields+'<label class="field">'+(newPassword ? 'Пароль от 12 символов' : 'Пароль')+
    '<input type="password" name="password" autocomplete="'+(newPassword ? 'new-password' : 'current-password')+
    '" '+(newPassword ? 'minlength="12" ' : '')+'maxlength="128" required></label>'+
    '<p id="team-account-error" class="notice error" role="alert" hidden></p><button class="button primary" type="submit">'+
    (newPassword ? 'Сохранить и войти' : 'Войти')+'</button>'+
    (account ? '<button class="button ghost" type="button" id="team-switch-account">Выйти</button>' : '')+'</form></section>';
  $('#team-switch-account')?.addEventListener('click',signOut);
  $('#team-account-form').onsubmit = async event => {
    event.preventDefault();
    const body = Object.fromEntries(new FormData(event.target));
    const button = event.submitter;
    if(button) button.disabled=true;
    try {
      const path = account?.temporary ? '/api/password' : setup ? '/api/setup' : '/api/login';
      await loadAccount(await teamRequest(path,{method:'POST',body}));
    } catch(cause) {
      const status = $('#team-account-error');
      if(status) { status.hidden=false; status.textContent=cause.message; }
      if(button) button.disabled=false;
    }
  };
}
async function loadAccount(data) {
  state.revision = -1;
  state.contacts = [];
  state.imports = [];
  state.members = [];
  state.selected.clear();
  state.view = 'board';
  resetFilters();
  showAccount(data);
  if(data.account && !data.account.temporary) await committed();
}
async function signOut() {
  try { await teamRequest('/api/logout',{method:'POST',body:{}}); location.reload(); }
  catch(cause) { report(cause); }
}
function bindTeam() {
  $('#team-people').onclick = managePeople;
  $('#team-assign').onclick = () => assignLeads([...state.selected]);
  $('#team-clear').onclick = () => { state.selected.clear(); render(); };
  $('#mode').onclick = signOut;
  document.addEventListener('change',event => {
    const box = event.target.closest('[data-select-lead]');
    if(!box) return;
    if(box.checked) state.selected.add(box.value);
    else state.selected.delete(box.value);
    renderSelection();
  });
  document.addEventListener('click',event => {
    const link = event.target.closest('[data-team-assign]');
    if(link) assignLeads([link.dataset.teamAssign]);
  });
  setInterval(async () => {
    if(!state.account || state.account.temporary || document.hidden || dialog.open || state.drag || $('#results').contains(document.activeElement)) return;
    try { if(await refresh()) render(); }
    catch(cause) { console.error(cause); }
  },7000);
}
async function start() {
  bindEvents();
  bindTeam();
  try { await loadAccount(await teamRequest('/api/session')); }
  catch(cause) {
    showAccount({account:null,setup:false});
    const status=$('#team-account-error');
    status.textContent='CRM не отвечает. Проверьте, запущен ли сервер, и обновите страницу.';
    status.hidden=false;
  }
}
start();
</script>
